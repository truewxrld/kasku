services:
  - type: web
    name: kasku-elmiro
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kasku-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_ENABLED
        value: "true"
databases:
  - name: kasku-db
    plan: free
    region: singapore
    databaseName: kasku
    user: kasku
